<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Display font (Doto 900, 4 KB) used above the fold -->
    <link rel="preload" href="/fonts/doto-latin-900.woff2" as="font" type="font/woff2" crossorigin />

    <!-- Updated by the theme script and toggle to match the page background -->
    <meta name="theme-color" content="#131518" />

    <!-- Apply the saved (or system) theme before first paint to avoid a flash -->
    <script>
      (function () {
        var theme;
        try { theme = localStorage.getItem("theme"); } catch (e) { /* storage unavailable */ }
        if (theme !== "light" && theme !== "dark") {
          theme = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        }
        document.documentElement.classList.toggle("dark", theme === "dark");
        document.documentElement.style.colorScheme = theme;
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.content = theme === "dark" ? "#131518" : "#ecedea";
      })();
    </script>

    <!-- Icons: one SVG for browser tabs (LED monogram, readable on light and dark tabs); PNGs for home screens -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
